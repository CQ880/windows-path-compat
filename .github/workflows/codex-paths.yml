name: Codex App Server Windows paths

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex-windows-probe
    paths:
      - .github/workflows/codex-paths.yml
      - codex_regression.py
      - examples/check_codex_paths.py
      - examples/sample.txt
      - winpath.py

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download the pinned App Server
        shell: pwsh
        run: |
          $name = 'codex-app-server-x86_64-pc-windows-msvc.exe'
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $bin = Join-Path $env:RUNNER_TEMP 'codex-app-server-0.169.0'
          $url = "https://github.com/openai/codex/releases/download/rust-v0.169.0/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 120
          $expected = '74d7277580a00aa93c252f31794c3ad7dc3f61e7ae17874bc95796ef999b1e4e'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine $expected) {
            throw 'App Server archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          "CODEX_PATHS_EXE=$(Join-Path $bin $name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify both known Codex regressions
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python codex_regression.py --server $env:CODEX_PATHS_EXE --root $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 1) { throw 'Expected the pinned release to reproduce the known regressions' }
          $report = Get-Content -Raw -LiteralPath 'codex-regression.json' | ConvertFrom-Json
          $collision = $report.filename_collision
          if ($report.server_version -ne 'codex-app-server 0.169.0' -or
              $report.ordinary_paths.exit_code -ne 0 -or $report.ordinary_paths.cases.Count -ne 10 -or
              $collision.exit_code -ne 1 -or $collision.status -ne 'filename-collision' -or
              $collision.replacement_name_count -ne 2 -or -not $collision.single_file_control_passed -or
              ($collision.actual_names_escaped -join ',') -cne 'bad\ud800.txt,bad\ufffd.txt' -or
              ($collision.returned_names_escaped -join ',') -cne 'bad\ufffd.txt,bad\ufffd.txt' -or
              ($collision.read_targets -join ',') -ne 'replacement-character-file,replacement-character-file' -or
              ($collision.without_replacement_sibling.returned_names_escaped -join ',') -cne 'bad\ufffd.txt' -or
              $collision.without_replacement_sibling.alias_read -ne 'rpc-error' -or
              $collision.without_replacement_sibling.rpc_error_code -ne -32603) {
            throw 'Expected ten passing ordinary paths and the verified filename alias'
          }
          $search = $report.file_search
          $queries = $search.queries
          $composed = "caf$([char]0x00e9)-note.txt"
          $decomposed = "cafe$([char]0x0301)-note.txt"
          if ($search.exit_code -ne 1 -or $search.status -ne 'search-normalization-difference' -or
              $search.same_results -ne $false -or $search.fixture_filenames.Count -ne 3 -or
              $queries.ascii.matched_filenames.Count -ne 3 -or $queries.ascii.missing_filenames.Count -ne 0 -or
              $queries.nfc.matched_filenames.Count -ne 1 -or $queries.nfc.missing_filenames.Count -ne 1 -or
              -not [string]::Equals($queries.nfc.matched_filenames[0], $composed, [StringComparison]::Ordinal) -or
              -not [string]::Equals($queries.nfc.missing_filenames[0], $decomposed, [StringComparison]::Ordinal) -or
              $queries.nfd.matched_filenames.Count -ne 2 -or $queries.nfd.missing_filenames.Count -ne 0) {
            throw 'Expected the ASCII control to find all files and the NFC query to miss the decomposed filename'
          }
          $drive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP))
          $summary = @"
          ## Codex App Server Windows path check

          Tested $($report.server_version) on $($report.platform) ($($report.machine), $($drive.DriveFormat)) with Python $($report.python_version).

          | Case | Observed result |
          | --- | --- |
          | Ordinary paths | $($report.ordinary_paths.cases.Count)/10 passed with the exact filename and expected bytes |
          | Real U+FFFD filename only | Read the expected bytes |
          | Unpaired surrogate filename only | Listed a nonexistent U+FFFD filename. Reading it returned RPC error $($collision.without_replacement_sibling.rpc_error_code). |
          | Both files with distinct contents | Listed the U+FFFD filename twice. Both reads returned the real U+FFFD file's bytes. |
          | Equivalent accented file searches | The ASCII control found all three files. The NFC query found one and missed the decomposed filename. The NFD query found both accented filenames. |

          The probe returned $($report.exit_code), confirming the expected reproductions of [openai/codex#60916](https://github.com/openai/codex/issues/60916) and [openai/codex#61022](https://github.com/openai/codex/issues/61022).
          "@
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8
          Write-Output $summary
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codex-regression-report
          path: codex-regression.json
          retention-days: 7
